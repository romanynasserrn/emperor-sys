<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emperor Sys | بوابة إدارة العمليات والمخازن</title>

  <!-- إعدادات تطبيق الموبايل PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/crown.png">

  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow-y: auto; }
    .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    .brand-header { text-align: center; margin-bottom: 20px; }
    .brand-title { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

    .install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }
    .install-banner-text { font-size: 12px; font-weight: 700; color: #1e40af; line-height: 1.4; }
    .btn-install { background: #2563eb; color: #ffffff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-input, .form-select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; background: white; }
    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .toggle-password-btn { position: absolute; left: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; padding: 4px; }
    .form-options { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 13px; }
    .remember-me { display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer; user-select: none; }
    .btn-submit { width: 100%; padding: 12px; background-color: var(--accent); color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    .btn-submit:hover { background-color: var(--accent-hover); }
    .btn-submit:disabled { background-color: var(--text-muted); cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; display: none; }
    .alert-danger { background-color: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

    .dashboard-container { display: none; height: 100vh; width: 100vw; overflow: hidden; position: relative; }
    
    .sidebar { 
      width: 280px; 
      background: var(--primary); 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      padding: 24px 16px; 
      flex-shrink: 0; 
      height: 100vh; 
      z-index: 50; 
      transition: width 0.3s ease, padding 0.3s ease, transform 0.3s ease; 
    }

    .sidebar.collapsed {
      width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      overflow: hidden !important;
      border: none !important;
    }

    .sidebar-header { padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 24px; position: relative; white-space: nowrap; }
    .company-badge { font-size: 16px; font-weight: 700; color: #ffffff; }
    .user-info { font-size: 12px; color: #94a3b8; margin-top: 4px; word-break: break-all; }
    .project-scope-badge { display: inline-block; margin-top: 8px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #1e293b; color: #38bdf8; border: 1px solid #334155; }
    .modules-nav { list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; overflow-y: auto; white-space: nowrap; }
    .module-item { padding: 12px 14px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.2s, color 0.2s; }
    .module-item:hover, .module-item.active { background: #1e293b; color: #ffffff; }
    .btn-logout { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; margin-top: auto; white-space: nowrap; }
    .btn-logout:hover { background: #334155; color: #ffffff; }

    .main-content { flex-grow: 1; height: 100vh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; width: 100%; }
    .workspace-header { padding: 12px 16px; background: #ffffff; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; min-height: 56px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .workspace-title { font-size: 16px; font-weight: 700; color: var(--primary); }
    .btn-external { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--accent); background: #eff6ff; border: 1px solid #bfdbfe; padding: 6px 10px; border-radius: 6px; text-decoration: none; }
    .workspace-body { flex-grow: 1; padding: 0; height: calc(100vh - 56px); position: relative; overflow-y: auto; width: 100%; }
    .module-iframe { width: 100%; height: 100%; border: none; display: block; }

    .menu-toggle-btn { 
      display: inline-flex !important; 
      align-items: center; 
      justify-content: center;
      background: #f1f5f9; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      padding: 8px 12px; 
      font-size: 18px; 
      cursor: pointer; 
      color: var(--primary); 
    }
    
    .sidebar-overlay { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(0, 0, 0, 0.5); 
      z-index: 40; 
      backdrop-filter: blur(2px); 
    }

    @media (max-width: 768px) {
      .sidebar { 
        position: fixed; 
        top: 0; 
        right: 0; 
        bottom: 0; 
        width: 82% !important; 
        max-width: 320px; 
        transform: translateX(100%); 
        box-shadow: -5px 0 25px rgba(0,0,0,0.3); 
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.active { display: block; }
      .workspace-header { padding: 10px 14px; }
      .workspace-title { font-size: 15px; }
    }

    .admin-panel { padding: 16px; max-width: 950px; margin: auto; }
    .admin-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .user-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 12px; }
    .user-table th, .user-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); }
    .user-table th { background: #f8fafc; font-weight: 700; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <h1 class="brand-title">EMPEROR SYS</h1>
        <p class="brand-subtitle">بوابة إدارة العمليات والمخازن المركزية</p>
      </div>

      <div id="installBanner" class="install-banner">
        <div class="install-banner-text">
          <span>📲 ثبّت تطبيق Emperor Sys</span>
          <div style="font-size: 10px; font-weight: normal; color: #4b5563;">للوصول السريع الميداني من الشاشة الرئيسية</div>
        </div>
        <button id="installAppBtn" class="btn-install">تثبيت الآن</button>
      </div>

      <div id="alertBox" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="userEmail">البريد الإلكتروني المعتمد</label>
          <div class="input-wrapper">
            <input type="email" id="userEmail" class="form-input" placeholder="name@company.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="userPassword">كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="userPassword" class="form-input" placeholder="••••••••" required>
            <button type="button" id="togglePasswordBtn" class="toggle-password-btn">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>تذكر بيانات الدخول</span>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول للمنظومة</button>
      </form>
    </div>
  </div>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- لوحة التحكم -->
  <div id="dashboardSection" class="dashboard-container">
    <aside id="mainSidebar" class="sidebar">
      <div class="sidebar-header">
        <div id="displayCompanyName" class="company-badge">-</div>
        <div id="displayUserEmail" class="user-info">-</div>
        <div id="displayProjectScope" class="project-scope-badge">-</div>
      </div>

      <nav>
        <ul id="dynamicNav" class="modules-nav"></ul>
      </nav>

      <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
    </aside>

    <main class="main-content">
      <div class="workspace-header">
        <div class="header-left">
          <button id="menuToggleBtn" class="menu-toggle-btn" title="القائمة">☰</button>
          <h2 id="activeModuleTitle" class="workspace-title">لوحة العمليات</h2>
        </div>
        <a id="externalLinkBtn" href="#" target="_blank" class="btn-external" style="display: none;">فتح بنافذة كاملة ↗</a>
      </div>
      <div id="workspaceBody" class="workspace-body"></div>
    </main>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygq-dtkn7FLlInFM4p3Z9CbGfcW1zzJBix7ywFTgMEAnwbPbwHgNEbAB6V8KZKjrNIyg/exec";

    // مصفوفة التقارير التنفيذية المتاحة لمدير المشروعات
    const SYSTEM_REPORTS = [
      {
        id: "TIMELINE_CONTROL",
        name: "الجدول الزمني",
        icon: "⏱️",
        fileUrl: "timeline.html",
        desc: "منظومة التحكم في المسار الزمني والتسليمات الهندسية وأقفال الأمان."
      }
    ];

    const SYSTEM_MODULES = {
      "INWARD": {
        name: "إدارة الوارد اليومي",
        icon: "📦",
        url: "https://script.google.com/macros/s/AKfycbyeE79yBlkUxAXkXJISMeKNx-AMuGqSYjnxd10jbAjXR4n_yvvGRwpClMisBftm6Kq5/exec",
        desc: "تسجيل ومطابقة أذون استلام التوريدات الميدانية والفحص الإداري."
      },
      "ALUMINUM": {
        name: "تتبع مصانع الألومنيوم",
        icon: "🏗️",
        url: "",
        desc: "تتبع مراحل تشغيل وتركيب قطاعات الألومنيوم لقطاع المشاريع."
      },
      "OUTWARD": {
        name: "الصرف ومقايسات البلوكات",
        icon: "📑",
        url: "",
        desc: "حوكمة صرف المواد وفق حدود حارس المقايسة المعتمد لكل بلوك."
      }
    };

    let currentSession = null;
    let metadataCache = null;
    let deferredInstallPrompt = null;

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const mainSidebar = document.getElementById('mainSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const dynamicNav = document.getElementById('dynamicNav');
    const displayCompanyName = document.getElementById('displayCompanyName');
    const displayUserEmail = document.getElementById('displayUserEmail');
    const displayProjectScope = document.getElementById('displayProjectScope');
    const logoutBtn = document.getElementById('logoutBtn');
    const activeModuleTitle = document.getElementById('activeModuleTitle');
    const externalLinkBtn = document.getElementById('externalLinkBtn');
    const workspaceBody = document.getElementById('workspaceBody');
    const userEmailInput = document.getElementById('userEmail');
    const userPasswordInput = document.getElementById('userPassword');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const rememberMeCheck = document.getElementById('rememberMe');
    const installBanner = document.getElementById('installBanner');
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBanner.style.display = 'flex';
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          installBanner.style.display = 'none';
        }
        deferredInstallPrompt = null;
      }
    });

    function toggleSidebar() {
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        mainSidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      } else {
        mainSidebar.classList.toggle('collapsed');
      }
    }

    function closeSidebar() {
      if (window.innerWidth <= 768) {
        mainSidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      }
    }

    menuToggleBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = userPasswordInput.type === 'password';
      userPasswordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
    });

    window.addEventListener('DOMContentLoaded', () => {
      const savedSession = localStorage.getItem('emperor_session');
      if (savedSession) {
        try {
          const parsed = JSON.parse(savedSession);
          currentSession = parsed;
          renderDashboard(parsed);
          return;
        } catch (e) {
          localStorage.removeItem('emperor_session');
        }
      }

      const savedEmail = localStorage.getItem('emperor_saved_email');
      if (savedEmail) {
        userEmailInput.value = savedEmail;
        userPasswordInput.focus();
      } else {
        userEmailInput.value = "";
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق...';

      const email = userEmailInput.value.trim();
      const password = userPasswordInput.value.trim();

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "LOGIN", email, password })
        });

        const data = await response.json();

        if (data.success) {
          currentSession = data;
          if (rememberMeCheck.checked) {
            localStorage.setItem('emperor_session', JSON.stringify(data));
            localStorage.setItem('emperor_saved_email', email);
          }
          renderDashboard(data);
        } else {
          showError(data.message || 'بيانات الدخول غير صحيحة');
        }
      } catch (err) {
        showError('تعذر الاتصال بالخادم المركزي');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول للمنظومة';
      }
    });

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function renderDashboard(sessionData) {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'flex';

      displayCompanyName.textContent = sessionData.company.companyName;
      displayUserEmail.textContent = sessionData.user.email + ' (' + sessionData.user.role + ')';

      if (sessionData.user.role === 'SUPER_ADMIN' || sessionData.user.assignedProjectId === 'ALL') {
        displayProjectScope.textContent = 'نطاق المشاريع: كافة المشاريع (' + (sessionData.projects ? sessionData.projects.length : 0) + ')';
      } else if (sessionData.projects && sessionData.projects.length > 0) {
        displayProjectScope.textContent = 'المشروع المسند: ' + sessionData.projects[0].name;
      }

      dynamicNav.innerHTML = '';

      const userRole = (sessionData.user.role || '').toUpperCase();
      const isProjectManager = (userRole === 'PROJECT_MANAGER' || userRole === 'DIRECTOR');

      // 1. صلاحيات المدير العام
      if (userRole === 'SUPER_ADMIN') {
        const adminLi = document.createElement('li');
        adminLi.className = 'module-item active';
        adminLi.innerHTML = '<span>🛡️</span> <span>إدارة الصلاحيات والمستخدمين</span>';
        adminLi.addEventListener('click', () => {
          document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
          adminLi.classList.add('active');
          closeSidebar();
          loadAdminUserManagement();
        });
        dynamicNav.appendChild(adminLi);
      }

      // 2. موديول الجدول الزمني (حصري وأساسي لمدير المشروعات والمدير العام)
      if (isProjectManager || userRole === 'SUPER_ADMIN') {
        const reportLi = document.createElement('li');
        reportLi.className = 'module-item' + (isProjectManager ? ' active' : '');
        reportLi.innerHTML = '<span>⏱️</span> <span>الجدول الزمني</span>';
        reportLi.addEventListener('click', () => {
          document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
          reportLi.classList.add('active');
          closeSidebar();
          loadReportView(SYSTEM_REPORTS[0]);
        });
        dynamicNav.appendChild(reportLi);
      }

      // 3. الموديولات الميدانية (تُحجب بالكامل عن مدير المشروعات)
      let allowed = isProjectManager ? [] : (sessionData.allowedModules || []);

      allowed.forEach((moduleKey, idx) => {
        const moduleInfo = SYSTEM_MODULES[moduleKey] || { name: moduleKey, icon: "📦", url: "" };
        const li = document.createElement('li');
        li.className = 'module-item' + (!isProjectManager && userRole !== 'SUPER_ADMIN' && idx === 0 ? ' active' : '');
        li.innerHTML = `<span>${moduleInfo.icon || '📦'}</span> <span>${moduleInfo.name}</span>`;

        li.addEventListener('click', () => {
          document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          closeSidebar();
          loadModuleView(moduleKey, moduleInfo);
        });

        dynamicNav.appendChild(li);
      });

      // توجيه الشاشة الافتراضية بدقة
      if (isProjectManager) {
        loadReportView(SYSTEM_REPORTS[0]);
      } else if (userRole === 'SUPER_ADMIN') {
        loadAdminUserManagement();
      } else if (allowed.length > 0) {
        loadModuleView(allowed[0], SYSTEM_MODULES[allowed[0]]);
      }
    }

    function loadReportView(report) {
      activeModuleTitle.textContent = report.name;
      externalLinkBtn.href = report.fileUrl;
      externalLinkBtn.style.display = 'inline-flex';
      externalLinkBtn.textContent = 'فتح بملء الشاشة ↗';

      workspaceBody.innerHTML = `<iframe class="module-iframe" src="${report.fileUrl}"></iframe>`;
    }

    function loadModuleView(moduleKey, moduleInfo) {
      activeModuleTitle.textContent = moduleInfo.name;

      if (moduleInfo.url && currentSession) {
        const compId = currentSession.company.companyId;
        const compName = currentSession.company.companyName;
        const userEmail = currentSession.user.email;
        const userRole = currentSession.user.role;
        const assignedProj = currentSession.user.assignedProjectId || 'ALL';
        const projectsParam = encodeURIComponent(JSON.stringify(currentSession.projects || []));

        const parameterizedUrl = `${moduleInfo.url}?cid=${encodeURIComponent(compId)}&cname=${encodeURIComponent(compName)}&uemail=${encodeURIComponent(userEmail)}&role=${encodeURIComponent(userRole)}&assigned_pid=${encodeURIComponent(assignedProj)}&projects=${projectsParam}`;

        externalLinkBtn.href = parameterizedUrl;
        externalLinkBtn.style.display = 'inline-flex';
        externalLinkBtn.textContent = 'فتح بنافذة كاملة ↗';
        workspaceBody.innerHTML = `<iframe class="module-iframe" src="${parameterizedUrl}" allow="camera; microphone; geolocation"></iframe>`;
      } else {
        externalLinkBtn.style.display = 'none';
        workspaceBody.innerHTML = `
          <div style="padding:40px; background:white; margin:16px; border-radius:12px; border:1px solid var(--border);">
            <h3>${moduleInfo.name}</h3>
            <p style="color:var(--text-muted); margin-top:8px;">${moduleInfo.desc || 'خدمة مفعلة بالمنظومة'}</p>
          </div>
        `;
      }
    }

    async function loadAdminUserManagement() {
      activeModuleTitle.textContent = "إدارة المستخدمين والصلاحيات";
      externalLinkBtn.style.display = 'none';
      workspaceBody.innerHTML = `<div style="text-align:center; padding:50px;">⏳ جاري تحميل بيانات الهيكل التنظيمي...</div>`;

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: "GET_METADATA", adminEmail: currentSession.user.email })
        });
        const meta = await res.json();
        if (!meta.success) {
          workspaceBody.innerHTML = `<div style="color:red; padding:20px;">خطأ: ${meta.message}</div>`;
          return;
        }

        metadataCache = meta;
        renderAdminForm(meta);

      } catch (err) {
        workspaceBody.innerHTML = `<div style="color:red; padding:20px;">فشل الاتصال بجداول الصلاحيات.</div>`;
      }
    }

    function renderAdminForm(meta) {
      let companyOptions = '';
      meta.companies.forEach(c => {
        companyOptions += `<option value="${c.id}">${c.name}</option>`;
      });

      let projectOptions = '<option value="ALL">كافة مشاريع الشركة (صلاحية كاملة)</option>';
      meta.projects.forEach(p => {
        projectOptions += `<option value="${p.id}">${p.name}</option>`;
      });

      let usersRows = '';
      meta.users.forEach(u => {
        const modulesDisplay = Array.isArray(u.allowedModules) ? u.allowedModules.join(', ') : (u.allowedModules || 'INWARD');
        usersRows += `
          <tr>
            <td style="font-weight:bold;">${u.email}</td>
            <td>${u.companyId}</td>
            <td>${u.role}</td>
            <td>${u.assignedProjectId}</td>
            <td style="color:#2563eb; font-weight:600;">${modulesDisplay}</td>
            <td><span style="color:${u.status === 'ACTIVE' ? 'green':'red'}; font-weight:bold;">${u.status}</span></td>
            <td>
              <button onclick="editUser('${u.email}')" style="background:#2563eb; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; margin-left:4px;">تعديل</button>
              <button onclick="deleteUser('${u.email}')" style="background:#dc2626; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">حذف</button>
            </td>
          </tr>
        `;
      });

      workspaceBody.innerHTML = `
        <div class="admin-panel">
          <div class="admin-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
              <h3 id="formTitle" style="font-size:16px; font-weight:bold; color:var(--primary);">➕ إضافة / تحديث مستخدم</h3>
              <button onclick="resetUserForm()" style="background:#f1f5f9; border:1px solid var(--border); padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer;">إعادة تعيين الفورم</button>
            </div>
            
            <form id="saveUserForm">
              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label">البريد الإلكتروني للموظف:</label>
                  <input type="email" id="targetEmail" class="form-input" placeholder="user@company.com" required>
                </div>
                <div class="form-group">
                  <label class="form-label">كلمة المرور (اتركها فارغة للتعديل دون تغيير):</label>
                  <input type="text" id="targetPass" class="form-input" placeholder="123456">
                </div>
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label">تابع لشركة:</label>
                  <select id="targetCompany" class="form-select">${companyOptions}</select>
                </div>
                <div class="form-group">
                  <label class="form-label">الدور الوظيفي (Role):</label>
                  <select id="targetRole" class="form-select">
                    <option value="STOREKEEPER">أمين مخزن (STOREKEEPER)</option>
                    <option value="PROJECT_MANAGER">مدير مشروع (PROJECT_MANAGER)</option>
                    <option value="DIRECTOR">مدير قطاع / إدارة (DIRECTOR)</option>
                    <option value="SUPER_ADMIN">مدير عام المنظومة (SUPER_ADMIN)</option>
                  </select>
                </div>
              </div>

              <div class="grid-2">
                <div class="form-group">
                  <label class="form-label">المشروع المتاح للمستخدم:</label>
                  <select id="targetProject" class="form-select">${projectOptions}</select>
                  <small style="color:var(--text-muted); font-size:11px;">إذا كان أمين مخزن، اختر مشروعه ليتم قفل شاشته عليه تلقائياً.</small>
                </div>
                <div class="form-group">
                  <label class="form-label">حالة الحساب:</label>
                  <select id="targetStatus" class="form-select">
                    <option value="ACTIVE">نشط (ACTIVE)</option>
                    <option value="INACTIVE">معطل (INACTIVE)</option>
                  </select>
                </div>
              </div>

              <!-- خيارات الموديولات والأدوات المتاحة للمستخدم -->
              <div class="form-group" style="margin-top: 10px;">
                <label class="form-label">الأدوات والموديولات المتاحة للمستخدم:</label>
                <div style="display: flex; flex-wrap: wrap; gap: 14px; background: #f8fafc; padding: 14px; border: 1px solid var(--border); border-radius: 8px;">
                  <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" name="userModule" value="INWARD" checked>
                    📦 إدارة الوارد اليومي
                  </label>
                  <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" name="userModule" value="ALUMINUM">
                    🏗️ تتبع مصانع الألومنيوم
                  </label>
                  <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" name="userModule" value="OUTWARD">
                    📑 الصرف ومقايسات البلوكات
                  </label>
                </div>
                <small style="color:var(--text-muted); font-size:11px; display:block; margin-top:4px;">حدد البرامج التي ستظهر في القائمة الجانبية للمستخدم بعد تسجيل دخوله.</small>
              </div>

              <button type="submit" id="saveUserBtn" class="btn-submit" style="margin-top:10px;">حفظ واعتماد المستخدم 💾</button>
            </form>
          </div>

          <div class="admin-card">
            <h3 style="margin-bottom:12px; font-size:15px; font-weight:bold;">📋 المستخدمون المعتمدون بالمنظومة</h3>
            <div style="overflow-x:auto;">
              <table class="user-table">
                <thead>
                  <tr>
                    <th>البريد الإلكتروني</th>
                    <th>كود الشركة</th>
                    <th>الدور</th>
                    <th>المشروع المتاح</th>
                    <th>الأدوات المتاحة</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                  </tr>
                </thead>
                <tbody>${usersRows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;

      document.getElementById('saveUserForm').addEventListener('submit', submitUserSave);
    }

    window.resetUserForm = function() {
      document.getElementById('formTitle').textContent = "➕ إضافة مستخدم جديد";
      document.getElementById('targetEmail').value = "";
      document.getElementById('targetEmail').readOnly = false;
      document.getElementById('targetPass').value = "";
      document.getElementById('targetRole').value = "STOREKEEPER";
      document.getElementById('targetProject').value = "ALL";
      document.getElementById('targetStatus').value = "ACTIVE";
      
      // إعادة ضبط مربعات الاختيار للوضع الافتراضي
      document.querySelectorAll('input[name="userModule"]').forEach(cb => {
        cb.checked = (cb.value === 'INWARD');
      });
    };

    window.editUser = function(email) {
      const user = metadataCache.users.find(u => u.email === email);
      if (!user) return;

      document.getElementById('formTitle').textContent = "✏️ تعديل صلاحيات: " + user.email;
      document.getElementById('targetEmail').value = user.email;
      document.getElementById('targetEmail').readOnly = true;
      document.getElementById('targetCompany').value = user.companyId;
      document.getElementById('targetRole').value = user.role;
      document.getElementById('targetProject').value = user.assignedProjectId;
      document.getElementById('targetStatus').value = user.status;
      document.getElementById('targetPass').value = "";

      // تحديد الموديولات المسجلة للمستخدم
      const userMods = Array.isArray(user.allowedModules) 
        ? user.allowedModules 
        : (user.allowedModules ? String(user.allowedModules).split(',') : ['INWARD']);

      document.querySelectorAll('input[name="userModule"]').forEach(cb => {
        cb.checked = userMods.includes('ALL') || userMods.includes(cb.value);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteUser = async function(email) {
      if (!confirm(`هل أنت متأكد من رغبتك في حذف المستخدم (${email}) نهائياً من قاعدة البيانات؟`)) {
        return;
      }

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: "DELETE_USER",
            email: email,
            adminEmail: currentSession.user.email
          })
        });

        const data = await res.json();
        if (data.success) {
          alert('✓ ' + data.message);
          loadAdminUserManagement();
        } else {
          alert('خطأ: ' + data.message);
        }
      } catch (err) {
        alert('حدث خطأ أثناء محاولة الحذف.');
      }
    };

    async function submitUserSave(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveUserBtn');

      const email = document.getElementById('targetEmail').value.trim();
      const password = document.getElementById('targetPass').value.trim();
      const companyId = document.getElementById('targetCompany').value;
      const role = document.getElementById('targetRole').value;
      const assignedProjectId = document.getElementById('targetProject').value;
      const status = document.getElementById('targetStatus').value;

      // جمع الموديولات المختارة
      const selectedModules = Array.from(document.querySelectorAll('input[name="userModule"]:checked'))
        .map(cb => cb.value);

      if (role !== 'PROJECT_MANAGER' && selectedModules.length === 0) {
        alert('يرجى اختيار أداة أو موديول واحد على الأقل للمستخدم.');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'جاري الحفظ في النواة المركزية...';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: "SAVE_USER",
            email,
            password: password || undefined,
            companyId,
            role,
            assignedProjectId,
            status,
            allowedModules: selectedModules
          })
        });

        const data = await res.json();
        if (data.success) {
          alert('✓ ' + data.message);
          loadAdminUserManagement();
        } else {
          alert('خطأ: ' + data.message);
        }
      } catch (err) {
        alert('حدث خطأ أثناء الاتصال بالخادم المركزي');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ واعتماد المستخدم 💾';
      }
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('emperor_session');
      currentSession = null;
      dashboardSection.style.display = 'none';
      loginSection.style.display = 'flex';
      userPasswordInput.value = '';
    });
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('PWA جاهز ومسجل:', reg.scope))
          .catch((err) => console.log('PWA فشل تسجيل العامل:', err));
      });
    }
  </script>
</body>
</html>
