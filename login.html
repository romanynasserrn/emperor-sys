<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emperor Sys | بوابة إدارة العمليات والمخازن</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* شاشة تسجيل الدخول */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: var(--text-muted);
      cursor: not-allowed;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-danger {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    /* لوحة التحكم الرئيسية */
    .dashboard-container {
      display: none;
      height: 100vh;
      overflow: hidden;
      flex-direction: row;
    }

    .sidebar {
      width: 280px;
      background: var(--primary);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 24px;
    }

    .company-badge {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .user-info {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .project-scope-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
    }

    .modules-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .module-item {
      padding: 12px 14px;
      border-radius: 8px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .module-item:hover, .module-item.active {
      background: #1e293b;
      color: #ffffff;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: auto;
    }

    .btn-logout:hover {
      background: #334155;
      color: #ffffff;
    }

    .main-content {
      flex-grow: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    .workspace-header {
      padding: 16px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .workspace-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-external {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-external:hover {
      background: #dbeafe;
    }

    .workspace-body {
      flex-grow: 1;
      padding: 0;
      height: calc(100vh - 65px);
      position: relative;
    }

    .module-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .placeholder-card {
      padding: 40px;
      margin: 24px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- 1. شاشة تسجيل الدخول -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <h1 class="brand-title">EMPEROR SYS</h1>
        <p class="brand-subtitle">نظام إدارة المشاريع وسلاسل الإمداد المتعدد</p>
      </div>

      <div id="alertBox" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="userEmail">البريد الإلكتروني المعتمد</label>
          <input type="email" id="userEmail" class="form-input" placeholder="name@company.com" required value="ceo@emperor-sys.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="userPassword">كلمة المرور</label>
          <input type="password" id="userPassword" class="form-input" placeholder="••••••••" required value="123456">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول للمنظومة</button>
      </form>
    </div>
  </div>

  <!-- 2. لوحة التحكم المركزية الديناميكية -->
  <div id="dashboardSection" class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div id="displayCompanyName" class="company-badge">-</div>
        <div id="displayUserEmail" class="user-info">-</div>
        <div id="displayProjectScope" class="project-scope-badge">-</div>
      </div>

      <nav>
        <ul id="dynamicNav" class="modules-nav">
          <!-- يتم إنشاء القائمة تلقائياً -->
        </ul>
      </nav>

      <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
    </aside>

    <main class="main-content">
      <div class="workspace-header">
        <h2 id="activeModuleTitle" class="workspace-title">إدارة الوارد اليومي</h2>
        <a id="externalLinkBtn" href="#" target="_blank" class="btn-external" style="display: none;">
          فتح بنافذة كاملة ↗
        </a>
      </div>
      <div id="workspaceBody" class="workspace-body">
        <!-- يتم تحميل البرنامج المضمن هنا -->
      </div>
    </main>
  </div>

  <script>
    // ------------------------------------------------------------------
    // رابط السكربت المركزي الخاص بقاعدة البيانات المركزية (Auth API)
    // ------------------------------------------------------------------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygq-dtkn7FLlInFM4p3Z9CbGfcW1zzJBix7ywFTgMEAnwbPbwHgNEbAB6V8KZKjrNIyg/exec";

    // ------------------------------------------------------------------
    // خريطة البرامج الفعلية المربوطة بالمنظومة
    // ------------------------------------------------------------------
    const SYSTEM_MODULES = {
      "INWARD": {
        name: "إدارة الوارد اليومي",
        url: "https://script.google.com/macros/s/AKfycbyeE79yBlkUxAXkXJISMeKNx-AMuGqSYjnxd10jbAjXR4n_yvvGRwpClMisBftm6Kq5/exec",
        desc: "تسجيل ومطابقة أذون استلام التوريدات الميدانية والفحص الإداري."
      },
      "OUTWARD": {
        name: "الصرف ومقايسات البلوكات",
        url: "",
        desc: "حوكمة صرف المواد وفق حدود حارس المقايسة المعتمد لكل بلوك."
      },
      "ALUMINUM": {
        name: "تتبع مصانع الألومنيوم",
        url: "",
        desc: "تتبع مراحل تشغيل وتركيب قطاعات الألومنيوم لقطاع المشاريع."
      }
    };

    // متغير لتخزين بيانات جلسة المستخدم بعد نجاح الدخول
    let currentSession = null;

    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const dynamicNav = document.getElementById('dynamicNav');
    const displayCompanyName = document.getElementById('displayCompanyName');
    const displayUserEmail = document.getElementById('displayUserEmail');
    const displayProjectScope = document.getElementById('displayProjectScope');
    const logoutBtn = document.getElementById('logoutBtn');
    const activeModuleTitle = document.getElementById('activeModuleTitle');
    const externalLinkBtn = document.getElementById('externalLinkBtn');
    const workspaceBody = document.getElementById('workspaceBody');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق والاتصال...';

      const email = document.getElementById('userEmail').value.trim();
      const password = document.getElementById('userPassword').value;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          currentSession = data;
          renderDashboard(data);
        } else {
          showError(data.message || 'فشل التحقق من البيانات المدخلة');
        }
      } catch (err) {
        showError('تعذر الاتصال بقاعدة البيانات المركزية. تأكد من إعدادات النشر Anyone.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول للمنظومة';
      }
    });

    function showError(msg) {
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }

    function renderDashboard(sessionData) {
      loginSection.style.display = 'none';
      dashboardSection.style.display = 'flex';

      displayCompanyName.textContent = sessionData.company.companyName;
      displayUserEmail.textContent = sessionData.user.email + ' (' + sessionData.user.role + ')';

      // عرض نطاق المشاريع المسند للمستخدم في الشريط الجانبي
      if (sessionData.user.role === 'SUPER_ADMIN' || sessionData.user.assignedProjectId === 'ALL') {
        displayProjectScope.textContent = 'نطاق المشاريع: كافة مشاريع الشركة (' + (sessionData.projects ? sessionData.projects.length : 0) + ')';
      } else if (sessionData.projects && sessionData.projects.length > 0) {
        displayProjectScope.textContent = 'المشروع المسند: ' + sessionData.projects[0].name;
      } else {
        displayProjectScope.textContent = 'نطاق المشاريع: غير محدد';
      }

      dynamicNav.innerHTML = '';
      const allowed = sessionData.allowedModules || [];

      if (allowed.length === 0) {
        dynamicNav.innerHTML = '<li style="font-size:12px;color:#94a3b8;padding:8px;">لا توجد خدمات نشطة بالتعاقد</li>';
        return;
      }

      allowed.forEach((moduleKey, index) => {
        const moduleInfo = SYSTEM_MODULES[moduleKey] || { name: moduleKey, url: "", desc: "خدمة مفعلة بالتعاقد" };
        const li = document.createElement('li');
        li.className = 'module-item' + (index === 0 ? ' active' : '');
        li.textContent = moduleInfo.name;

        li.addEventListener('click', () => {
          document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
          li.classList.add('active');
          loadModuleView(moduleKey, moduleInfo);
        });

        dynamicNav.appendChild(li);
      });

      // تشغيل أول موديول افتراضياً
      if (allowed.length > 0) {
        loadModuleView(allowed[0], SYSTEM_MODULES[allowed[0]]);
      }
    }

    function loadModuleView(moduleKey, moduleInfo) {
      activeModuleTitle.textContent = moduleInfo.name;

      if (moduleInfo.url && currentSession) {
        // تجهيز معاملات الجلسة لتمريرها في الرابط المضمن
        const compId = currentSession.company.companyId;
        const compName = currentSession.company.companyName;
        const userEmail = currentSession.user.email;
        const userRole = currentSession.user.role;
        const assignedProj = currentSession.user.assignedProjectId || 'ALL';
        
        // تحويل قائمة المشاريع إلى نص مشفر
        const projectsParam = encodeURIComponent(JSON.stringify(currentSession.projects || []));

        // بناء الرابط المدمج بالمعاملات
        const parameterizedUrl = `${moduleInfo.url}?cid=${encodeURIComponent(compId)}&cname=${encodeURIComponent(compName)}&uemail=${encodeURIComponent(userEmail)}&role=${encodeURIComponent(userRole)}&assigned_pid=${encodeURIComponent(assignedProj)}&projects=${projectsParam}`;

        externalLinkBtn.href = parameterizedUrl;
        externalLinkBtn.style.display = 'inline-flex';
        workspaceBody.innerHTML = `<iframe class="module-iframe" src="${parameterizedUrl}" allow="camera; microphone; geolocation"></iframe>`;
      } else {
        externalLinkBtn.style.display = 'none';
        workspaceBody.innerHTML = `
          <div class="placeholder-card">
            <h3 style="margin-bottom:8px; color:var(--primary);">${moduleInfo.name}</h3>
            <p style="color:var(--text-muted); font-size:14px; line-height:1.6;">${moduleInfo.desc}</p>
            <p style="margin-top:16px; font-size:13px; color:#2563eb; font-weight:600;">(جاهز للربط مع برنامجك القائم فور تزويد رابطه)</p>
          </div>
        `;
      }
    }

    logoutBtn.addEventListener('click', () => {
      currentSession = null;
      dashboardSection.style.display = 'none';
      loginSection.style.display = 'flex';
      document.getElementById('userPassword').value = '';
    });
  </script>
</body>
</html>
